<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KST Y học">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Ôn thi Ký sinh trùng y học</title>
<style>
:root{
  --blue:#1d4ed8;--blue-600:#2563eb;--blue-50:#eff6ff;--blue-100:#dbeafe;--blue-200:#bfdbfe;
  --ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f5f8ff;--card:#fff;
  --ok:#059669;--ok-bg:#ecfdf5;--bad:#dc2626;--bad-bg:#fef2f2;--warn:#b45309;--warn-bg:#fffbeb;
  --r:14px;--shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(29,78,216,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.top h1{font-size:16px;margin:0;line-height:1.2}
.top small{color:var(--muted);font-size:12.5px}
main{max-width:860px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b))}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs .in{display:flex;max-width:860px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;border-radius:10px;color:var(--muted);
  font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--blue);font-weight:600}
@media(min-width:900px){
  nav.tabs{position:sticky;top:57px;bottom:auto;border:0;border-bottom:1px solid var(--line);padding:4px}
  nav.tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:14px;min-height:44px}
  main{padding-bottom:40px}
}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:18px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.muted{color:var(--muted)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.g4{grid-template-columns:repeat(2,1fr)}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.2;color:var(--blue);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:12px;
  border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:600;font-size:15.5px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--blue);border-color:var(--blue-200)}
.btn.soft{background:var(--blue-50);color:var(--blue);border-color:var(--blue-100)}
.btn.danger{background:#fff;color:var(--bad);border-color:#fecaca}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.bad{background:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;min-height:40px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.bar{height:8px;background:var(--blue-100);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-bottom:8px}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--blue-50);color:var(--blue);font-weight:600}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.qtext{font-size:17.5px;font-weight:600;line-height:1.45;margin:10px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:13px 14px;min-height:54px;font-size:16px;line-height:1.4}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt:hover{border-color:var(--blue-200)}
.opt.sel{border-color:var(--blue);background:var(--blue-50)}
.opt.sel .k{background:var(--blue);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);border:1px solid #a7f3d0}
.fb.bad{background:var(--bad-bg);border:1px solid #fecaca}
.fb b.t{display:block;margin-bottom:4px}
.flag{margin-top:10px;background:var(--warn-bg);border:1px solid #fde68a;color:#78350f;border-radius:12px;padding:10px 12px;font-size:14px}
.nav3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.nav3 .btn{padding:10px 6px;font-size:15px}
select,input[type=number]{font:inherit;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;width:100%}
label.f{display:block;font-size:13.5px;color:var(--muted);margin:12px 0 6px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue);background:var(--blue-50);padding:6px 12px;border-radius:10px}
.timer.low{color:var(--bad);background:var(--bad-bg)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.qgrid button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;font-variant-numeric:tabular-nums}
.qgrid button.ans{background:var(--blue-100);border-color:var(--blue-200)}
.qgrid button.cur{outline:2px solid var(--blue)}
.qgrid button.r{background:var(--ok-bg);border-color:#a7f3d0;color:var(--ok)}
.qgrid button.w{background:var(--bad-bg);border-color:#fecaca;color:var(--bad)}
.qgrid button.s{background:#f1f5f9;color:var(--muted)}
/* flashcard */
.fc-wrap{perspective:1200px}
.fc{position:relative;width:100%;min-height:340px;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:22px 20px;
  display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.fc .back{transform:rotateY(180deg);background:linear-gradient(180deg,#fff, var(--blue-50))}
.fc .face .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.fc .front .q{font-size:18px;font-weight:600;margin:auto 0;line-height:1.45}
.fc .back .ans{font-size:20px;font-weight:700;color:var(--blue);margin:12px 0 10px}
.fc .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .q{font-size:14.5px}
.pill{font-size:12.5px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.topicrow{margin:10px 0}
.topicrow .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.score{font-size:44px;font-weight:800;color:var(--blue);line-height:1;font-variant-numeric:tabular-nums}
table.h{width:100%;border-collapse:collapse;font-size:14px}
table.h th,table.h td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
table.h th{color:var(--muted);font-weight:600;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.sec-title{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo">KST</div>
  <div><h1>Ôn thi Ký sinh trùng y học</h1><small id="subtitle">110 câu · Đề cương ôn</small></div>
</div></header>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
// Ngân hàng câu hỏi — nguồn: "ĐỀ CƯƠNG ÔN" Ký sinh trùng y học (110 câu).
// a = đáp án đúng (giữ nguyên theo PDF), d = 3 phương án nhiễu, e = giải thích ngắn,
// f = ghi chú cần kiểm tra (nếu có). Thứ tự đáp án được đảo ngẫu nhiên khi hiển thị.
const TOPICS = {
  dc: "Đại cương ký sinh trùng",
  sr: "Ký sinh trùng sốt rét (Plasmodium)",
  gd: "Giun đũa (Ascaris lumbricoides)",
  gt: "Giun tóc (Trichuris trichiura)",
  gm: "Giun móc/mỏ (A. duodenale – N. americanus)",
  gk: "Giun kim (Enterobius vermicularis)"
};
const QUESTIONS = [
{id:1,t:"dc",q:"Khi hai sinh vật khác loài kết hợp sống chung với nhau một cách mật thiết (mang tính bắt buộc) trong đó hai bên cùng có lợi (hoặc ít nhất 1 loài có lợi) thì mối tương quan đó là gì?",a:"Cộng sinh",d:["Hội sinh","Tương sinh","Ký sinh"],e:"Cộng sinh: sống chung mật thiết, mang tính BẮT BUỘC, các bên cùng có lợi. Khác với tương sinh (cùng có lợi nhưng không bắt buộc)."},
{id:2,t:"dc",q:"Khi hai sinh vật khác loài kết hợp sống chung với nhau (không mang tính bắt buộc) trong đó một bên có lợi và bên kia cũng không có lợi và cũng không bị hại thì mối tương quan đó là gì?",a:"Hội sinh",d:["Cộng sinh","Tương sinh","Ký sinh"],e:"Hội sinh: một bên có lợi, bên kia không lợi cũng không hại, không bắt buộc."},
{id:3,t:"dc",q:"Khi hai sinh vật khác loài kết hợp sống chung với nhau (không mang tính bắt buộc) và cả hai bên cùng có lợi hơn thì mối tương quan đó là gì?",a:"Tương sinh",d:["Cộng sinh","Hội sinh","Ký sinh"],e:"Tương sinh: cả hai cùng có lợi nhưng KHÔNG bắt buộc (phân biệt với cộng sinh là bắt buộc)."},
{id:4,t:"dc",q:"Khi hai sinh vật khác loài kết hợp sống chung với nhau một bên thì có lợi và một bên bị hại thì mối tương quan đó là gì?",a:"Ký sinh",d:["Cộng sinh","Hội sinh","Tương sinh"],e:"Ký sinh: một bên có lợi (ký sinh trùng), một bên bị hại (ký chủ)."},
{id:5,t:"dc",q:"Ký sinh trùng nào sau đây có tính đặc hiệu rộng về “ký chủ” và rộng về “cơ quan ký sinh”?",a:"Toxoplasma gondii (trùng cong)",d:["Enterobius vermicularis (giun kim)","Trichuris trichiura (giun tóc)","Necator americanus (giun mỏ)"],e:"Toxoplasma gondii ký sinh ở nhiều loài ký chủ và nhiều cơ quan khác nhau → đặc hiệu rộng cả về ký chủ lẫn nơi ký sinh."},
{id:6,t:"dc",q:"Trong lĩnh vực ký sinh trùng y học thì ”ký chủ” về nghĩa hẹp được hiểu như thế nào?",a:"Khi KST sống ở một loại ký chủ duy nhất",d:["Khi KST sống ở nhiều loại ký chủ khác nhau","Khi KST tồn tại ở một cơ quan duy nhất","Khi KST tồn tại ở nhiều cơ quan khác nhau"],e:"“Ký chủ” nghĩa hẹp = KST chỉ sống ở một loại ký chủ duy nhất. Chú ý phân biệt với “nơi ký sinh” (nói về cơ quan)."},
{id:7,t:"dc",q:"Trong lĩnh vực ký sinh trùng y học thì “ký chủ” về nghĩa rộng được hiểu như thế nào?",a:"Khi KST sống ở nhiều loại ký chủ khác nhau",d:["Khi KST sống ở một loại ký chủ duy nhất","Khi KST tồn tại ở một cơ quan duy nhất","Khi KST tồn tại ở nhiều cơ quan khác nhau"],e:"“Ký chủ” nghĩa rộng = KST có thể sống ở nhiều loại ký chủ khác nhau."},
{id:8,t:"dc",q:"Trong lĩnh vực ký sinh trùng y học thì “nơi ký sinh” về nghĩa hẹp được hiểu như thế nào?",a:"Khi KST tồn tại ở một cơ quan duy nhất",d:["Khi KST tồn tại ở nhiều cơ quan khác nhau","Khi KST sống ở một loại ký chủ duy nhất","Khi KST sống ở nhiều loại ký chủ khác nhau"],e:"“Nơi ký sinh” nói về CƠ QUAN: nghĩa hẹp = chỉ ở một cơ quan duy nhất."},
{id:9,t:"dc",q:"Trong lĩnh vực ký sinh trùng y học thì “nơi ký sinh” về nghĩa rộng được hiểu như thế nào?",a:"Khi KST tồn tại ở nhiều cơ quan khác nhau",d:["Khi KST tồn tại ở một cơ quan duy nhất","Khi KST sống ở một loại ký chủ duy nhất","Khi KST sống ở nhiều loại ký chủ khác nhau"],e:"“Nơi ký sinh” nghĩa rộng = KST có thể tồn tại ở nhiều cơ quan khác nhau."},
{id:10,t:"dc",q:"Trong lĩnh vực ký sinh trùng y học thì “ký sinh trùng bắt buộc”, tức là KST muốn tồn tại thì sao? (Chọn đáp án đúng)",a:"Phải ký sinh",d:["Có thể sống tự do ngoài môi trường","Có thể ký sinh hoặc sống tự do tùy điều kiện","Chỉ cần ký sinh ở giai đoạn trứng"],e:"KST bắt buộc: muốn tồn tại thì PHẢI ký sinh. Loại có thể sống tự do hoặc ký sinh là KST tùy nghi."},
{id:11,t:"dc",q:"Trong lĩnh vực ký sinh trùng y học thì ký sinh trùng chuyển sang một “cơ quan” khác với “cơ quan” nó thường ký sinh thì được gọi là gì?",a:"KST lạc chỗ",d:["KST lạc chủ","KST ngẫu nhiên","KST tùy nghi"],e:"Lạc CHỖ = sai cơ quan trong cùng ký chủ. Lạc CHỦ = sang ký chủ khác loài và không phát triển bình thường."},
{id:12,t:"dc",q:"Trong lĩnh vực ký sinh trùng y học thì ký sinh trùng “có thể sống tự do ngoài môi trường hay ký sinh trong cơ thể ký chủ” thường được gọi là gì?",a:"KST tùy nghi",d:["KST bắt buộc","KST lạc chỗ","KST ngẫu nhiên"],e:"KST tùy nghi: vừa có thể sống tự do, vừa có thể ký sinh."},
{id:13,t:"dc",q:"Trong lĩnh vực ký sinh trùng y học thì ký chủ mà ký sinh trùng sống ở giai đoạn trưởng thành hoặc định giống được, thì được gọi là gì?",a:"Ký chủ vĩnh viễn",d:["Ký chủ trung gian","Tàng chủ","Người lành mang mầm bệnh"],e:"Ký chủ vĩnh viễn: nơi KST trưởng thành / sinh sản hữu tính (định giống)."},
{id:14,t:"dc",q:"Trong lĩnh vực ký sinh trùng y học thì ký chủ mà ký sinh trùng sống ở giai đoạn ấu trùng hoặc chưa định giống được, thường được gọi là gì?",a:"Ký chủ trung gian",d:["Ký chủ vĩnh viễn","Tàng chủ","Người lành mang mầm bệnh"],e:"Ký chủ trung gian: nơi KST sống ở giai đoạn ấu trùng hoặc chưa định giống."},
{id:15,t:"dc",q:"Trong lĩnh vực ký sinh trùng y học khi người mang mầm bệnh ký sinh trùng trong cơ thể nhưng không có biểu hiện bệnh thường được gọi là gì?",a:"Người lành mang mầm bệnh",d:["Tàng chủ","Ký chủ trung gian","Người bệnh mạn tính"],e:"Mang KST nhưng không có triệu chứng = người lành mang mầm bệnh (nguồn lây quan trọng)."},
{id:16,t:"dc",q:"Trong lĩnh vực ký sinh trùng y học, khái niệm “Tàng chủ” để chỉ nơi chứa ký sinh trùng ở giai đoạn nào?",a:"Đã lây nhiễm được",d:["Chưa có khả năng lây nhiễm","Chỉ ở giai đoạn trưởng thành","Chỉ ở giai đoạn trứng"],e:"Tàng chủ: nơi chứa KST ở giai đoạn đã có khả năng lây nhiễm sang người."},
{id:17,t:"dc",q:"Trong lĩnh vực ký sinh trùng y học, khi ký sinh trùng rời ký chủ phải cần có thời gian phát triển ở ngoại cảnh trước khi xâm nhập vào cơ thể ký chủ được gọi là gì?",a:"Chu trình trực tiếp dài",d:["Chu trình trực tiếp ngắn","Chu trình gián tiếp","Chu trình tự nhiễm"],e:"Trực tiếp DÀI: cần thời gian phát triển ở ngoại cảnh (VD giun đũa, giun tóc). Trực tiếp NGẮN: lây nhiễm được ngay (VD giun kim)."},
{id:18,t:"dc",q:"Trong lĩnh vực ký sinh trùng y học, khi ký sinh trùng rời ký chủ không cần phải có thời gian phát triển ở ngoại cảnh trước khi xâm nhập vào cơ thể ký chủ được gọi là gì?",a:"Chu trình trực tiếp ngắn",d:["Chu trình trực tiếp dài","Chu trình gián tiếp","Chu trình gián tiếp qua hai ký chủ trung gian"],e:"Không cần phát triển ở ngoại cảnh = trực tiếp ngắn (điển hình: giun kim)."},
{id:19,t:"dc",q:"Tên khoa học của giun kim viết đúng là như thế nào?",a:"Enterobius vermicularis",d:["Enterobius vermiculare","Enterobious vermicularis","Enterobius vermicularus"],e:"Danh pháp: tên giống viết hoa chữ đầu, tên loài viết thường; viết đúng chính tả: Enterobius vermicularis."},
{id:20,t:"dc",q:"Nhiễm giun, sán thường thấy tăng bạch cầu nào sau đây?",a:"Ái toan",d:["Trung tính","Ái kiềm","Đơn nhân"],e:"Nhiễm giun sán (nhất là giai đoạn ấu trùng di chuyển) thường làm tăng bạch cầu ái toan (eosinophil)."},
{id:21,t:"dc",q:"Chu trình phát triển gián tiếp là ký sinh trùng nào sau đây?",a:"Taenia saginata (Sán dải bò)",d:["Ascaris lumbricoides (giun đũa)","Enterobius vermicularis (giun kim)","Trichuris trichiura (giun tóc)"],e:"Sán dải bò cần ký chủ trung gian (bò) → chu trình gián tiếp. Giun đũa, giun tóc, giun kim đều có chu trình trực tiếp."},
{id:22,t:"dc",q:"Căn cứ vào đặc điểm của Toxocara spp. (giun đũa chó-mèo) gây bệnh cho người và phát biểu nào sau đây là đúng?",a:"KST lạc chủ",d:["KST lạc chỗ","KST tùy nghi","KST ngẫu nhiên"],e:"Toxocara ký sinh chính ở chó, mèo; vào người (ký chủ khác loài) không phát triển bình thường thành con trưởng thành → KST lạc chủ."},
{id:23,t:"dc",q:"Căn cứ vào đặc điểm của Trichuris trichiura (giun tóc) gây bệnh cho người, ta có thể xếp nó vào ký sinh trùng nào sau đây?",a:"Ký sinh trùng bắt buộc",d:["Ký sinh trùng tùy nghi","Ký sinh trùng lạc chủ","Ký sinh trùng ngẫu nhiên"],e:"Giun tóc phải ký sinh mới tồn tại được → KST bắt buộc."},
{id:24,t:"dc",q:"Chu trình gián tiếp qua hai ký chủ trung gian là ký sinh trùng nào sau đây?",a:"Fasciolopsis buski (sán lá ruột lớn)",d:["Taenia saginata (sán dải bò)","Ascaris lumbricoides (giun đũa)","Enterobius vermicularis (giun kim)"],e:"Theo đề cương: Fasciolopsis buski có chu trình gián tiếp (ốc là ký chủ trung gian, nang trùng bám trên thực vật thủy sinh).",f:"Nhiều giáo trình chỉ ghi F. buski có MỘT ký chủ trung gian (ốc); thực vật thủy sinh chỉ là giá thể mang nang trùng. Ví dụ kinh điển cho “hai ký chủ trung gian” thường là sán lá gan nhỏ Clonorchis sinensis (ốc + cá). Nên đối chiếu lại với giảng viên/giáo trình."},
{id:25,t:"dc",q:"Chu trình trực tiếp ngắn của ký sinh trùng là loài giun nào sau đây?",a:"Giun kim",d:["Giun đũa","Giun tóc","Giun móc"],e:"Trứng giun kim có tính lây nhiễm sau thời gian rất ngắn, không cần phát triển ở đất → trực tiếp ngắn."},
{id:26,t:"dc",q:"Việc phòng - chống bệnh KST ở Việt Nam hiện nay, đặc biệt là giun sán thì việc khó khăn nhất là do vấn đề gì sau đây là chính?",a:"Dễ tái nhiễm",d:["Thiếu thuốc điều trị đặc hiệu","Giun sán kháng thuốc mạnh","Không có phương pháp chẩn đoán"],e:"Thuốc tẩy giun hiệu quả và rẻ, nhưng do điều kiện vệ sinh, tập quán nên người dân rất dễ tái nhiễm."},
{id:27,t:"dc",q:"Trong các bệnh do KST gây ra cho người sau đây thì loại nào phổ biến nhất ở Việt Nam hiện nay?",a:"Giun đũa",d:["Sán lá gan nhỏ","Sán dải lợn","Giun lươn"],e:"Theo đề cương, bệnh giun đũa là bệnh KST phổ biến nhất ở Việt Nam."},
{id:28,t:"dc",q:"Căn cứ vào đặc điểm ký sinh của ký sinh trùng thì người không là ký chủ vĩnh viễn của loại Ký sinh trùng nào sau đây?",a:"Plasmodium falciparum (KST sốt rét)",d:["Ascaris lumbricoides (giun đũa)","Enterobius vermicularis (giun kim)","Taenia saginata (sán dải bò)"],e:"Với Plasmodium, sinh sản hữu tính xảy ra trong muỗi → muỗi là ký chủ vĩnh viễn, người là ký chủ trung gian."},
{id:29,t:"dc",q:"Kích thước của ký sinh trùng hiểu như thế nào cho đúng? (chọn đáp án đúng nhất)",a:"Kích thước to nhỏ tuỳ loại KST",d:["KST luôn có kích thước hiển vi","KST luôn nhìn thấy được bằng mắt thường","Kích thước KST luôn nhỏ hơn tế bào ký chủ"],e:"KST có kích thước rất khác nhau: từ đơn bào hiển vi đến sán dải dài nhiều mét."},
{id:30,t:"dc",q:"KST ngẫu nhiên là khi KST từ ký chủ chính sang ký sinh ở một ký chủ mới có các đặc điểm nào sau đây?",a:"KST phát triển bình thường",d:["KST không thể phát triển bình thường","KST chuyển sang cơ quan khác trong cùng ký chủ","KST chết ngay khi vào ký chủ mới"],e:"KST ngẫu nhiên: sang ký chủ mới nhưng vẫn phát triển bình thường. Ngược lại, KST lạc chủ không phát triển bình thường."},
{id:31,t:"dc",q:"KST lạc chủ là khi KST từ ký chủ chính sang ký sinh ở một ký chủ mới có các đặc điểm nào sau đây?",a:"Ký chủ mới khác loài và KST không thể phát triển bình thường",d:["Ký chủ mới khác loài và KST phát triển bình thường","Ký chủ mới cùng loài và KST phát triển bình thường","KST chuyển sang cơ quan khác trong cùng ký chủ"],e:"Lạc chủ = ký chủ khác loài + KST không phát triển bình thường (VD Toxocara ở người)."},
{id:32,t:"dc",q:"Danh pháp quốc tế về KST quy định viết tắt là như thế nào?",a:"Được viết tắt tên giống không được viết tắt tên loài",d:["Được viết tắt tên loài không được viết tắt tên giống","Được viết tắt cả tên giống và tên loài","Không được viết tắt cả tên giống và tên loài"],e:"Chỉ viết tắt tên giống, giữ nguyên tên loài: VD Plasmodium vivax → P. vivax."},
{id:33,t:"sr",q:"Thể ngủ (hypnozoite) của Plasmodium spp. (KST sốt rét) có đặc điểm nào sau đây?",a:"Gây bệnh sốt rét tái phát xa",d:["Gây bệnh sốt rét ác tính","Gây tái phát gần do KST còn tồn tại trong máu","Là thể lây nhiễm cho muỗi"],e:"Thể ngủ nằm trong tế bào gan, “thức dậy” sau nhiều tháng → tái phát xa."},
{id:34,t:"sr",q:"Plasmodium spp. (KST sốt rét) gây tái phát xa có thể ngủ ở trong cơ quan nào?",a:"Gan",d:["Lách","Tủy xương","Hồng cầu"],e:"Thể ngủ (hypnozoite) nằm trong tế bào gan."},
{id:35,t:"sr",q:"Plasmodium spp. (KST sốt rét) có thể ngủ gây tái phát xa là loài nào sau đây?",a:"P. ovale, P. vivax",d:["P. falciparum, P. malariae","P. falciparum, P. vivax","P. malariae, P. ovale"],e:"Chỉ P. vivax và P. ovale có thể ngủ ở gan → tái phát xa."},
{id:36,t:"sr",q:"Có thể tìm thấy trong máu ngoại vi của bệnh nhân sốt rét các thể/dạng nào sau đây?",a:"Tư dưỡng (trophozoite)",d:["Thể ngủ (hypnozoite)","Phân liệt ngoài hồng cầu (tại gan)","Trứng nang (oocyst)"],e:"Thể tư dưỡng nằm trong hồng cầu nên thấy được trên lam máu ngoại vi. Thể ngủ và phân liệt ngoài hồng cầu ở gan; trứng nang ở muỗi."},
{id:37,t:"sr",q:"Vector chính truyền bệnh sốt rét ở vùng rừng núi toàn quốc Việt Nam là loài nào?",a:"Anopheles minimus",d:["Anopheles sundaicus","Anopheles subpictus","Aedes aegypti"],e:"An. minimus là vector chính vùng rừng núi. An. sundaicus là vector vùng ven biển nước lợ; Aedes truyền sốt xuất huyết."},
{id:38,t:"sr",q:"Giao bào (gametocyte) của Plasmodium spp. (KST sốt rét) được hình thành tại đâu?",a:"Chu trình hồng cầu",d:["Chu trình ngoài hồng cầu (tại gan)","Trong dạ dày muỗi","Trong tuyến nước bọt muỗi"],e:"Một số KST trong hồng cầu biệt hóa thành giao bào đực/cái → hình thành ở chu trình hồng cầu."},
{id:39,t:"sr",q:"Với Plasmodium spp. (KST gây bệnh cho người), chu trình phát triển ở muỗi là chúng phát triển trong ký chủ hay tàng chủ?",a:"Ký chủ vĩnh viễn",d:["Ký chủ trung gian","Tàng chủ","Ký chủ ngẫu nhiên"],e:"Sinh sản hữu tính diễn ra trong muỗi → muỗi Anopheles là ký chủ vĩnh viễn."},
{id:40,t:"sr",q:"Giao bào của Plasmodium spp. (KST sốt rét) khi hình thành trong cơ thể người mang đặc điểm gì?",a:"Sẽ tiếp tục phát triển trong cơ thể muỗi",d:["Tiếp tục sinh sản vô tính trong hồng cầu người","Gây ra cơn sốt điển hình","Xâm nhập lại tế bào gan và gây tái phát"],e:"Giao bào không phát triển tiếp ở người; chỉ tiếp tục phát triển khi được muỗi hút vào."},
{id:41,t:"sr",q:"Giai đoạn Plasmodium spp. (KST sốt rét) mới xâm nhập hồng cầu phát triển gọi là thể nào sau đây?",a:"Tư dưỡng (trophozoite)",d:["Phân liệt (schizont)","Giao bào (gametocyte)","Thoa trùng (sporozoite)"],e:"KST vừa vào hồng cầu phát triển thành thể tư dưỡng (tư dưỡng non hình nhẫn)."},
{id:42,t:"sr",q:"P. falciparum (KST sốt rét) gây bệnh cho người rất hiếm gặp thể nào trong máu ngoại vi?",a:"Phân liệt",d:["Thể nhẫn (tư dưỡng non)","Giao bào hình liềm","Hồng cầu nhiễm nhiều thể nhẫn"],e:"Ở P. falciparum, phân liệt phát triển ở mao mạch nội tạng nên hiếm gặp trong máu ngoại vi; thường thấy thể nhẫn và giao bào hình liềm."},
{id:43,t:"sr",q:"Plasmodium spp. (KST sốt rét) dễ gây ác tính và tử vong nhất cho người là loài nào?",a:"Plasmodium falciparum",d:["Plasmodium vivax","Plasmodium malariae","Plasmodium ovale"],e:"P. falciparum gây sốt rét ác tính, tỷ lệ tử vong cao nhất."},
{id:44,t:"sr",q:"Trong các Plasmodium spp. (KST sốt rét) thì kháng thuốc mạnh mẽ nhất là loài nào?",a:"Plasmodium falciparum",d:["Plasmodium vivax","Plasmodium malariae","Plasmodium ovale"],e:"P. falciparum là loài kháng thuốc mạnh và phổ biến nhất."},
{id:45,t:"sr",q:"Chuẩn vàng của xét nghiệm chẩn đoán bệnh sốt rét hiện nay ở Việt Nam là kỹ thuật nào sau đây?",a:"Lam máu nhuộm giemsa",d:["Test chẩn đoán nhanh (RDT)","PCR","Huyết thanh miễn dịch (ELISA)"],e:"Lam máu nhuộm Giemsa soi kính hiển vi là tiêu chuẩn vàng chẩn đoán sốt rét."},
{id:46,t:"sr",q:"Plasmodium spp. (KST sốt rét) kháng thuốc điều trị sốt rét ở người chủ yếu là kháng với thuốc diệt thể nào sau đây?",a:"Phân liệt và thể tư dưỡng",d:["Giao bào","Thể ngủ (hypnozoite)","Thoa trùng (sporozoite)"],e:"Kháng thuốc chủ yếu là kháng thuốc diệt thể vô tính trong hồng cầu (phân liệt, tư dưỡng) – nhóm thuốc cắt cơn."},
{id:47,t:"sr",q:"Nguyên tắc điều trị bệnh sốt rét Plasmodium vivax ngoài cắt cơn cần chú ý quan trọng là điều trị cắt cơn kết hợp với điều trị gì?",a:"Chống tái phát",d:["Chống lây lan","Hạ sốt đơn thuần","Điều trị dự phòng cho người nhà"],e:"P. vivax có thể ngủ ở gan → phải kết hợp điều trị chống tái phát (diệt thể ngủ)."},
{id:48,t:"sr",q:"Một nguyên tắc điều trị bệnh sốt rét Plasmodium falciparum ngoài cắt cơn cần chú ý quan trọng là điều trị cắt cơn kết hợp với điều trị gì?",a:"Chống lây lan",d:["Chống tái phát","Hạ sốt đơn thuần","Điều trị dự phòng cho người nhà"],e:"P. falciparum không có thể ngủ nhưng giao bào tồn tại lâu → kết hợp diệt giao bào để chống lây lan."},
{id:49,t:"sr",q:"Đặc điểm khi nhiễm KST sốt rét P. falciparum về kích thước hồng cầu là gì?",a:"Không thay đổi",d:["Lớn hơn bình thường","Nhỏ hơn bình thường","Biến dạng hình bầu dục"],e:"Hồng cầu nhiễm P. falciparum không thay đổi kích thước (khác P. vivax làm hồng cầu to ra)."},
{id:50,t:"sr",q:"Đặc điểm về kích thước của tế bào hồng cầu khi nhiễm KST sốt rét P. vivax thường biểu hiện là gì?",a:"Lớn hơn bình thường",d:["Không thay đổi","Nhỏ hơn bình thường","Biến dạng hình bầu dục có tua"],e:"P. vivax làm hồng cầu nhiễm to hơn bình thường."},
{id:51,t:"gd",q:"Ascaris lumbricoides (giun đũa) đực khác con cái ở đặc điểm nào sau đây?",a:"Nhỏ hơn, đuôi cong",d:["Lớn hơn, đuôi thẳng","Nhỏ hơn, đuôi thẳng","Lớn hơn, đuôi cong"],e:"Giun đũa đực nhỏ hơn và đuôi cong; con cái dài hơn, đuôi thẳng."},
{id:52,t:"gd",q:"Ascaris lumbricoides (giun đũa) cái khác con đực ở đặc điểm nào sau đây?",a:"Dài hơn, đuôi thẳng.",d:["Ngắn hơn, đuôi cong.","Ngắn hơn, đuôi thẳng.","Dài hơn, đuôi cong."],e:"Giun đũa cái dài hơn, đuôi thẳng."},
{id:53,t:"gd",q:"Ascaris lumbricoides (giun đũa) có thể gây ra hội chứng Loeffler ở giai đoạn nào?",a:"Giai đoạn ấu trùng di chuyển",d:["Giai đoạn giun trưởng thành tại ruột non","Giai đoạn trứng ở ngoại cảnh","Giai đoạn giun lạc chỗ vào ống mật"],e:"Hội chứng Loeffler (ho, sốt, thâm nhiễm phổi, tăng ái toan) do ấu trùng di chuyển qua phổi."},
{id:54,t:"gd",q:"Ascaris lumbricoides (giun đũa) giai đoạn ấu trùng di chuyển tại phổi có đặc điểm nào sau đây?",a:"Giai đoạn này không cần điều trị",d:["Cần điều trị ngay bằng thuốc tẩy giun","Luôn gây biến chứng nặng tại phổi","Xét nghiệm phân đã thấy trứng giun"],e:"Theo đề cương: giai đoạn ấu trùng qua phổi thường tự khỏi, không cần điều trị. Lúc này chưa có giun trưởng thành nên xét nghiệm phân chưa thấy trứng."},
{id:55,t:"gd",q:"Ascaris lumbricoides (giun đũa) trưởng thành sống trong cơ thể người ký sinh tại cơ quan nào trong cơ thể?",a:"Ruột non",d:["Manh tràng","Ruột già","Dạ dày"],e:"Giun đũa trưởng thành ký sinh ở ruột non."},
{id:56,t:"gd",q:"Chu trình phát triển của Ascaris lumbricoides (giun đũa) thuộc loại chu trình nào sau đây?",a:"Đơn giản",d:["Gián tiếp qua một ký chủ trung gian","Gián tiếp qua hai ký chủ trung gian","Phức tạp, cần tàng chủ động vật"],e:"Giun đũa có chu trình đơn giản (trực tiếp), không cần ký chủ trung gian."},
{id:57,t:"gd",q:"Những hành vi nào sau đây có nguy cơ gây nhiễm Ascaris lumbricoides (giun đũa) được coi là thấp?",a:"Ăn thịt, cá không nấu chín",d:["Ăn rau sống không hợp vệ sinh","Uống nước lã","Không rửa tay trước khi ăn"],e:"Giun đũa lây do nuốt trứng có ấu trùng (rau, nước, tay bẩn), không lây qua thịt cá → ăn thịt cá sống có nguy cơ thấp."},
{id:58,t:"gd",q:"Trứng Ascaris lumbricoides (giun đũa) đã thụ tinh khi theo phân ra ngoài môi trường bên ngoài có đặc tính nào sau đây?",a:"Cần thời gian phát triển mới nhiễm được",d:["Có thể lây nhiễm ngay","Đã chứa ấu trùng giai đoạn lây nhiễm","Không thể phát triển ở ngoại cảnh"],e:"Trứng cần phát triển ở ngoại cảnh (khoảng 10–15 ngày) mới có ấu trùng lây nhiễm → chu trình trực tiếp dài."},
{id:59,t:"gd",q:"Giai đoạn ấu trùng Ascaris lumbricoides (giun đũa) qua phổi xét nghiệm máu có đặc điểm nào sau đây về bạch cầu?",a:"Ái toan tăng cao",d:["Trung tính tăng cao","Lympho tăng cao","Bạch cầu giảm"],e:"Ấu trùng di chuyển qua phổi → bạch cầu ái toan tăng cao."},
{id:60,t:"gd",q:"Khi bị nhiễm Ascaris lumbricoides (giun đũa) giai đoạn ấu trùng sẽ lột xác ở phổi 2 lần vào các ngày thứ bao nhiêu?",a:"5 - 6 và 10",d:["2 - 3 và 7","10 và 15","7 - 8 và 14"],e:"Ấu trùng giun đũa lột xác ở phổi 2 lần: ngày 5–6 và ngày 10."},
{id:61,t:"gd",q:"Ascaris lumbricoides (giun đũa) có thể gây biến chứng ngoài ruột là gây viêm cơ quan nào sau đây?",a:"Túi mật, sỏi mật, viêm tụy cấp",d:["Viêm phổi, viêm màng phổi","Viêm cơ tim","Viêm não, màng não"],e:"Giun đũa lạc chỗ lên đường mật, ống tụy → viêm túi mật, sỏi mật, viêm tụy cấp."},
{id:62,t:"gd",q:"Ascaris lumbricoides (giun đũa) có thể gây ra các biến chứng tại ruột như thế nào?",a:"Tắc ruột, xoắn ruột, lồng ruột",d:["Sa trực tràng","Ngứa hậu môn về đêm","Xuất huyết tiêu hóa ồ ạt"],e:"Búi giun đũa gây tắc ruột, xoắn ruột, lồng ruột. (Sa trực tràng là biến chứng của giun tóc.)"},
{id:63,t:"gd",q:"Trứng không thụ tinh của Ascaris lumbricoides (giun đũa) có đặc điểm nào?",a:"Vỏ có 2 lớp màng nhưng không phát triển được",d:["Vỏ có 3 lớp màng và phát triển được","Vỏ có 2 lớp màng và phát triển được","Vỏ có 3 lớp màng nhưng không phát triển được"],e:"Trứng không thụ tinh: vỏ 2 lớp, không phát triển được. Trứng thụ tinh: vỏ 3 lớp, phát triển được."},
{id:64,t:"gd",q:"Trứng thụ tinh của Ascaris lumbricoides (giun đũa) có đặc điểm nào?",a:"Vỏ có 3 lớp màng và phát triển được",d:["Vỏ có 2 lớp màng nhưng không phát triển được","Vỏ có 2 lớp màng và phát triển được","Vỏ có 3 lớp màng nhưng không phát triển được"],e:"Trứng thụ tinh: vỏ 3 lớp màng, phát triển được thành trứng có ấu trùng."},
{id:65,t:"gd",q:"Chẩn đoán xác định bệnh do Ascaris lumbricoides (giun đũa) đường ruột dựa vào cận lâm sàng nào sau đây?",a:"Xét nghiệm phân tìm trứng",d:["Công thức máu tìm bạch cầu ái toan","X-quang phổi","Huyết thanh miễn dịch"],e:"Bệnh giun đũa ở ruột: chẩn đoán xác định bằng xét nghiệm phân tìm trứng."},
{id:66,t:"gd",q:"Nguy cơ nhiễm Ascaris lumbricoides (giun đũa) cao nhất là hành động nào sau đây?",a:"Ăn rau sống không hợp vệ sinh",d:["Ăn thịt, cá không nấu chín","Đi chân đất","Tắm sông, suối"],e:"Lây qua đường tiêu hóa do nuốt trứng có ấu trùng — rau sống không sạch là nguồn chính."},
{id:67,t:"gd",q:"Trứng đã thụ tinh Ascaris lumbricoides (giun đũa) ở ngoài môi trường bên ngoài có đặc điểm gì?",a:"Đề kháng rất tốt với môi trường bên ngoài",d:["Chết nhanh khi ra ngoài môi trường","Chỉ tồn tại được vài giờ","Dễ bị tiêu diệt bởi nước lạnh"],e:"Vỏ dày nhiều lớp giúp trứng đề kháng rất tốt, tồn tại nhiều năm trong đất."},
{id:68,t:"gd",q:"Hãy chọn đáp án đúng về điều trị Ascaris lumbricoides (giun đũa) hiện nay là dùng thuốc để: (1) Diệt ấu trùng trong cơ thể; (2) Diệt giun trưởng thành trong cơ thể; (3) Diệt trứng trong đường tiêu hóa; (4) Diệt ấu trùng, con trưởng thành và cả trứng trong lòng ruột.",a:"(2)",d:["(1) và (2)","(2) và (3)","(4)"],e:"Thuốc điều trị giun đũa hiện nay nhằm diệt giun trưởng thành trong ruột → chọn (2)."},
{id:69,t:"gd",q:"Ascaris lumbricoides (giun đũa) trưởng thành trong cơ thể có thể lạc chỗ nhưng không thể lạc chỗ đến vị trí nào trong cơ thể?",a:"Lách",d:["Ống mật","Ruột thừa","Ống tụy"],e:"Giun đũa lạc chỗ theo các ống thông với lòng ruột (ống mật, ống tụy, ruột thừa…); lách không thông với ruột."},
{id:70,t:"gd",q:"Thứ tự mà hành trình ấu trùng Ascaris lumbricoides (giun đũa) đi qua là theo trình tự nào sau đây?",a:"Ruột, gan, tim, phổi",d:["Ruột, tim, gan, phổi","Ruột, phổi, gan, tim","Gan, ruột, tim, phổi"],e:"Ấu trùng nở ở ruột → theo tĩnh mạch cửa lên gan → tim phải → phổi → lên hầu, nuốt xuống ruột."},
{id:71,t:"gd",q:"Trứng Ascaris lumbricoides (giun đũa) đã thụ tinh gặp điều kiện thuận lợi (trong đất xốp, ẩm, bóng râm), trứng có thể tồn tại và gây bệnh đến bao lâu?",a:"7 năm",d:["1 năm","3 tháng","15 năm"],e:"Theo đề cương: trong điều kiện thuận lợi, trứng giun đũa tồn tại và gây bệnh đến 7 năm."},
{id:72,t:"gd",q:"Trứng Ascaris lumbricoides (giun đũa) mới thụ tinh gặp điều kiện thuận lợi (nhiệt độ 20-30°C trong đất xốp, ẩm có bóng râm) có thể thành trứng có ấu trùng giai đoạn lây nhiễm trong thời gian bao lâu?",a:"10-15 ngày",d:["2-3 ngày","1-2 tháng","6 tháng"],e:"Điều kiện thuận lợi: khoảng 10–15 ngày trứng thành trứng có ấu trùng lây nhiễm."},
{id:73,t:"gt",q:"Chu trình phát triển của Trichuris trichiura (giun tóc) không có các đặc điểm nào sau đây?",a:"Ấu trùng có giai đoạn chu du qua gan, tim, phổi",d:["Trứng phải phát triển ở ngoại cảnh mới lây nhiễm","Lây nhiễm qua đường tiêu hóa","Giun trưởng thành ký sinh ở manh tràng"],e:"Khác giun đũa, ấu trùng giun tóc KHÔNG chu du qua gan–tim–phổi; nở ở ruột non rồi xuống manh tràng."},
{id:74,t:"gt",q:"Trichuris trichiura (giun tóc) con trưởng thành có đặc điểm hình thể như thế nào?",a:"Phần đầu nhỏ như sợi tóc, đuôi phình to",d:["Phần đầu phình to, đuôi nhỏ như sợi tóc","Thân hình ống đều, hai đầu thon nhọn","Thân dẹt, chia thành nhiều đốt"],e:"Giun tóc: phần đầu nhỏ như sợi tóc (cắm vào niêm mạc), phần đuôi phình to."},
{id:75,t:"gt",q:"Trichuris trichiura (giun tóc) trứng có hình dạng đặc biệt gì?",a:"Hình trái xoan hai đầu có nút nhầy",d:["Hình bầu dục không đối xứng","Hình bầu dục, vỏ dày xù xì","Hình bầu dục vỏ mỏng, có phôi đang phân chia"],e:"Trứng giun tóc hình trái xoan (quả cau), hai đầu có nút nhầy — rất đặc trưng."},
{id:76,t:"gt",q:"Trứng Trichuris trichiura (giun tóc) mới đẻ cần thời gian phát triển thành trứng chứa ấu trùng có thể lây nhiễm là bao lâu?",a:"Khoảng 17-30 ngày",d:["Khoảng 4-6 giờ","Khoảng 3-5 ngày","Khoảng 6-12 tháng"],e:"Trứng giun tóc cần khoảng 17–30 ngày ở ngoại cảnh để có ấu trùng lây nhiễm."},
{id:77,t:"gt",q:"Đời sống của Trichuris trichiura (giun tóc) trong cơ thể người có thể kéo dài mấy năm?",a:"4-6 năm",d:["1-2 tháng","6-12 tháng","15-20 năm"],e:"Theo đề cương: giun tóc sống trong cơ thể người 4–6 năm."},
{id:78,t:"gt",q:"Vị trí Trichuris trichiura (giun tóc) thường ký sinh trong ruột người cơ quan nào?",a:"Manh tràng",d:["Tá tràng","Hỗng tràng","Dạ dày"],e:"Giun tóc ký sinh chủ yếu ở manh tràng (đại tràng)."},
{id:79,t:"gt",q:"Thức ăn chủ yếu của Trichuris trichiura (giun tóc) là gì?",a:"Máu",d:["Dưỡng chấp","Thức ăn đã tiêu hóa trong lòng ruột","Dịch mật"],e:"Theo đề cương: giun tóc cắm đầu vào niêm mạc ruột và hút máu."},
{id:80,t:"gt",q:"Phòng – chống bệnh do Trichuris trichiura (giun tóc) gặp trở ngại chính là do đâu?",a:"Tình trạng dễ tái nhiễm",d:["Thiếu thuốc điều trị","Giun kháng thuốc mạnh","Không có phương pháp chẩn đoán"],e:"Giống giun đũa: trở ngại chính là rất dễ tái nhiễm."},
{id:81,t:"gt",q:"Phòng ngừa nhiễm Trichuris trichiura (giun tóc) tương tự như phòng ngừa loài nào sau đây?",a:"Ascaris lumbricoides (giun đũa)",d:["Enterobius vermicularis (giun kim)","Ancylostoma duodenale (giun móc)","Taenia saginata (sán dải bò)"],e:"Giun tóc và giun đũa cùng lây qua đường tiêu hóa từ trứng phát triển ở đất → phòng ngừa giống nhau."},
{id:82,t:"gt",q:"Chẩn đoán xác định bệnh Trichuris trichiura (giun tóc) là dựa vào cận lâm sàng gì?",a:"Xét nghiệm phân tìm trứng",d:["Công thức máu","Nội soi dạ dày","Huyết thanh miễn dịch"],e:"Chẩn đoán xác định: xét nghiệm phân tìm trứng giun tóc."},
{id:83,t:"gt",q:"Nguy cơ nhiễm Trichuris trichiura (giun tóc) được cho là cao nhất với các hành động nào sau đây?",a:"Ăn rau sống không hợp vệ sinh",d:["Đi chân đất","Ăn thịt bò tái","Tắm sông, suối"],e:"Lây qua đường tiêu hóa do nuốt trứng có ấu trùng (rau sống, tay bẩn)."},
{id:84,t:"gt",q:"Đường lây truyền của Trichuris trichiura (giun tóc) là đường nào?",a:"Chỉ qua đường tiêu hóa",d:["Chỉ qua da","Qua da và đường tiêu hóa","Qua côn trùng đốt"],e:"Giun tóc chỉ lây qua đường tiêu hóa (khác giun móc/mỏ xâm nhập qua da)."},
{id:85,t:"gt",q:"Chu trình phát triển của Trichuris trichiura (giun tóc) thuộc loại chu trình nào sau đây?",a:"Trực tiếp dài",d:["Trực tiếp ngắn","Gián tiếp qua một ký chủ trung gian","Gián tiếp qua hai ký chủ trung gian"],e:"Trứng cần 17–30 ngày phát triển ở ngoại cảnh → chu trình trực tiếp dài."},
{id:86,t:"gt",q:"Trichuris trichiura (giun tóc) có thể gây bệnh cho các loài nào sau đây?",a:"Chỉ ở người",d:["Người và chó, mèo","Người và lợn","Nhiều loài động vật có vú"],e:"Trichuris trichiura chỉ ký sinh ở người."},
{id:87,t:"gt",q:"Trichuris trichiura (giun tóc) có phần đầu nhỏ để thực hiện chức năng nào là chính?",a:"Bám và xuyên vào thành ruột",d:["Tiêu hóa thức ăn","Đẻ trứng","Di chuyển trong mạch máu"],e:"Đầu nhỏ như sợi tóc giúp cắm, bám chắc vào niêm mạc ruột."},
{id:88,t:"gt",q:"Trichuris trichiura (giun tóc) gây ra bệnh cảnh lâm sàng thường gặp nhất là triệu chứng gì?",a:"Rối loạn tiêu hóa, phân nhầy máu",d:["Ngứa hậu môn về đêm","Ho, sốt (hội chứng Loeffler)","Tắc ruột"],e:"Giun tóc gây tổn thương niêm mạc đại tràng → rối loạn tiêu hóa, phân nhầy máu."},
{id:89,t:"gt",q:"Trichuris trichiura (giun tóc) có thể gây ra một trong các biến chứng nguy hiểm là gì?",a:"Sa trực tràng",d:["Tắc ống mật","Viêm tụy cấp","Lồng ruột"],e:"Nhiễm giun tóc nặng (nhất là ở trẻ em) có thể gây sa trực tràng."},
{id:90,t:"gm",q:"Chu trình phát triển của A. duodenale – N. americanus (giun móc/mỏ) trong cơ thể người con cái trưởng thành đẻ trứng tại ruột non với đặc điểm nào sau đây?",a:"Trứng ra ngoài rồi phát triển thành ấu trùng",d:["Trứng nở thành ấu trùng ngay trong ruột","Con cái bò ra đẻ trứng quanh hậu môn","Ấu trùng được đẻ trực tiếp vào máu"],e:"Trứng theo phân ra ngoài, ở đất ẩm nở thành ấu trùng và phát triển đến giai đoạn lây nhiễm."},
{id:91,t:"gm",q:"Ấu trùng của A. duodenale – N. americanus (giun móc/mỏ) có thể phát triển các giai đoạn như thế nào?",a:"Giai đoạn 1, 2 và 3 tại ngoại cảnh",d:["Giai đoạn 1 tại ngoại cảnh, giai đoạn 2 và 3 trong cơ thể người","Cả 3 giai đoạn đều trong cơ thể người","Giai đoạn 1 và 2 trong trứng, giai đoạn 3 trong cơ thể người"],e:"Ấu trùng giai đoạn 1, 2, 3 đều phát triển ở ngoại cảnh; giai đoạn 3 là ấu trùng lây nhiễm."},
{id:92,t:"gm",q:"Ấu trùng Ancylostoma duodenale (giun móc) xâm nhập cơ thể người bằng đường gì?",a:"Xâm nhập qua da là chính nhưng cũng có khi qua đường tiêu hóa",d:["Chỉ xâm nhập qua da","Chỉ qua đường tiêu hóa","Qua đường hô hấp"],e:"Giun MÓC: qua da là chính, đôi khi qua tiêu hóa. Giun MỎ: chỉ qua da."},
{id:93,t:"gm",q:"Ấu trùng Necator americanus (giun mỏ) xâm nhập cơ thể người bằng đường gì?",a:"Chỉ xâm nhập qua da",d:["Xâm nhập qua da là chính nhưng cũng có khi qua đường tiêu hóa","Chỉ qua đường tiêu hóa","Qua muỗi đốt"],e:"Giun mỏ (Necator) chỉ xâm nhập qua da."},
{id:94,t:"gm",q:"Vị trí ký sinh chủ yếu của A. duodenale – N. americanus (giun móc/mỏ) trong cơ thể người là ở vị trí nào sau đây?",a:"Tá tràng",d:["Manh tràng","Dạ dày","Đại tràng sigma"],e:"Giun móc/mỏ ký sinh chủ yếu ở tá tràng."},
{id:95,t:"gm",q:"A. duodenale – N. americanus (giun móc/mỏ) trưởng thành ký sinh trong cơ thể người, thức ăn của chúng là gì?",a:"Máu của bệnh nhân",d:["Dưỡng chấp trong lòng ruột","Dịch mật","Thức ăn chưa tiêu hóa"],e:"Giun móc/mỏ hút máu → gây thiếu máu nhược sắc."},
{id:96,t:"gm",q:"Đời sống trung bình của A. duodenale (giun móc) là mấy năm?",a:"4-5 năm",d:["1-2 tháng","6 tháng","15-20 năm"],e:"Theo đề cương: giun móc sống trung bình 4–5 năm."},
{id:97,t:"gm",q:"A. duodenale – N. americanus (giun móc/mỏ) từ khi xâm nhập cơ thể người đến khi con cái trưởng thành có thể đẻ trứng trong khoảng thời gian bao lâu?",a:"Sau khoảng 5 tháng",d:["Sau khoảng 24 giờ","Sau khoảng 1 tuần","Sau khoảng 2 năm"],e:"Đáp án theo đề cương: sau khoảng 5 tháng.",f:"Nhiều tài liệu ghi khoảng 5–7 TUẦN (A. duodenale đôi khi kéo dài nhiều tháng do ấu trùng tạm ngừng phát triển). Có thể đề cương ghi “5 tháng” thay vì “5 tuần” — nên hỏi lại giảng viên đáp án được chấm."},
{id:98,t:"gm",q:"Thói quen nào sau đây của người dân được coi là làm tăng khả năng nhiễm Necator americanus (giun mỏ)?",a:"Đi chân đất",d:["Ăn rau sống","Ăn thịt lợn tái","Mút tay"],e:"Giun mỏ chỉ xâm nhập qua da → đi chân đất là nguy cơ chính."},

{id:103,t:"gk",q:"Con cái trưởng thành của Enterobius vermicularis (giun kim) trong suốt vòng đời của mình có đặc điểm đẻ trứng bao nhiêu lần?",a:"1 lần",d:["2 lần","Đẻ liên tục hằng ngày","Hàng chục lần"],e:"Giun kim cái chỉ đẻ trứng 1 lần rồi chết."},

{id:109,t:"gk",q:"Chu trình phát triển thành con trưởng thành của Enterobius vermicularis (giun kim) có giai đoạn nào sau đây?",a:"Lột xác 2 lần tại đường tiêu hóa",d:["Ấu trùng chu du qua gan, tim, phổi","Phát triển ở đất trước khi lây nhiễm","Phát triển qua ký chủ trung gian"],e:"Theo đề cương: ấu trùng giun kim lột xác 2 lần tại đường tiêu hóa, không chu du qua phổi."},
{id:110,t:"gk",q:"Từ khi bị nhiễm đến khi phát triển thành con trưởng thành có thể đẻ trứng của Enterobius vermicularis (giun kim) cần thời gian trong bao lâu?",a:"4 – 8 tuần",d:["2 – 3 ngày","6 – 12 tháng","2 – 3 năm"],e:"Theo đề cương: khoảng 4–8 tuần."}
];

</script>
<script>
"use strict";
// ---------- tiện ích ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const QMAP = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const LETTERS = ["A","B","C","D"];
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800); }
// Tạo 4 lựa chọn đã đảo ngẫu nhiên; trả về {opts:[text], correct:index}
function makeOptions(q){ const opts = shuffle([q.a, ...q.d]); return { opts, correct: opts.indexOf(q.a) }; }

// ---------- lưu trữ ----------
const KEY = "kst_quiz_v1";
let S;
function blank(){ return { q:{}, exams:[], v:1 }; }
function load(){ try { S = JSON.parse(localStorage.getItem(KEY)) || blank(); } catch(e){ S = blank(); } if(!S.q) S.q={}; if(!S.exams) S.exams=[]; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function st(id){ return S.q[id] || (S.q[id] = { n:0, c:0, w:0, wa:false, card:null, last:null }); }
// ghi nhận 1 lần trả lời (luyện tập / thi / ôn câu sai)
function record(id, ok){
  const s = st(id); s.n++; s.last = ok ? 1 : 0;
  if (ok) { s.c++; s.wa = false; } else { s.w++; s.wa = true; }
  save();
}
load();

// ---------- tính thống kê ----------
function stats(){
  let done=0, c=0, n=0, wrongActive=0, unknown=0, known=0;
  const byT = {};
  for (const k in TOPICS) byT[k] = { total:0, done:0, c:0, n:0 };
  for (const q of QUESTIONS){
    const s = S.q[q.id]; const t = byT[q.t]; t.total++;
    if (!s) continue;
    if (s.n > 0 || s.card) { done++; t.done++; }
    c += s.c; n += s.n; t.c += s.c; t.n += s.n;
    if (s.wa) wrongActive++;
    if (s.card === "u") unknown++; if (s.card === "k") known++;
  }
  return { done, c, n, acc: pct(c,n), wrongActive, unknown, known, byT };
}

// ---------- điều hướng ----------
const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
  prac:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  exam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 2h12a2 2 0 0 1 2 2v12"/></svg>',
  wrong:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>'
};
const TABS = [["home","Tổng quan"],["prac","Luyện tập"],["exam","Thi thử"],["card","Flashcard"],["wrong","Câu sai"]];
let view = "home";
let examTimer = null;
function go(v){
  if (view === "exam" && E && E.running && v !== "exam") { if(!confirm("Bạn đang làm bài thi. Rời đi sẽ huỷ bài thi này?")) return; stopExam(); E=null; }
  view = v; renderTabs(); render(); window.scrollTo(0,0);
}
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k,l]) => {
    let badge = "";
    if (k==="wrong"){ const n = stats().wrongActive; if(n) badge = ` (${n})`; }
    return `<button class="${view===k?'on':''}" onclick="go('${k}')" aria-label="${l}">${ICONS[k]}<span>${l}${badge}</span></button>`;
  }).join("");
}
function render(){
  const f = { home:renderHome, prac:renderPrac, exam:renderExam, card:renderCard, wrong:renderWrong }[view];
  $("#app").innerHTML = f(); if (f.after) f.after();
}
function topicChips(sel, fn){
  return `<div class="chips"><button class="chip ${sel==='all'?'on':''}" onclick="${fn}('all')">Tất cả</button>` +
    Object.entries(TOPICS).map(([k,v]) => `<button class="chip ${sel===k?'on':''}" onclick="${fn}('${k}')">${esc(v.split(" (")[0])}</button>`).join("") + `</div>`;
}
function topicName(t){ return TOPICS[t]; }

// ================= TỔNG QUAN =================
function renderHome(){
  const s = stats(); const total = QUESTIONS.length;
  const weak = Object.entries(s.byT).filter(([,t]) => t.n >= 3).map(([k,t]) => ({ k, acc: pct(t.c,t.n), n:t.n })).sort((a,b) => a.acc-b.acc).slice(0,3);
  const flagged = QUESTIONS.filter(q => q.f);
  return `
  <h2>Tổng quan</h2>
  <div class="card">
    <div class="sec-title"><b>Tiến độ học tập</b><span class="muted">${s.done}/${total} câu</span></div>
    <div class="bar" style="margin-top:10px"><i style="width:${pct(s.done,total)}%"></i></div>
  </div>
  <div class="grid g4" style="margin-top:12px">
    <div class="stat"><b>${total}</b><span>Tổng số câu</span></div>
    <div class="stat"><b>${s.done}</b><span>Đã học</span></div>
    <div class="stat"><b>${s.acc}%</b><span>Tỷ lệ đúng (${s.c}/${s.n} lượt)</span></div>
    <div class="stat"><b style="color:var(--bad)">${s.wrongActive}</b><span>Câu sai cần ôn</span></div>
    <div class="stat"><b style="color:var(--ok)">${s.known}</b><span>Thẻ đã nhớ</span></div>
    <div class="stat"><b style="color:var(--warn)">${s.unknown}</b><span>Thẻ chưa nhớ</span></div>
    <div class="stat"><b>${S.exams.length}</b><span>Lần thi thử</span></div>
    <div class="stat"><b>${S.exams.length ? Math.max(...S.exams.map(e=>e.score)).toFixed(1) : "–"}</b><span>Điểm thi cao nhất</span></div>
  </div>

  <h3>Theo chủ đề</h3>
  <div class="card">
  ${Object.entries(s.byT).map(([k,t]) => `
    <div class="topicrow">
      <div class="lab"><span>${esc(TOPICS[k])}</span><span class="muted">${t.done}/${t.total}${t.n?` · ${pct(t.c,t.n)}% đúng`:''}</span></div>
      <div class="bar"><i style="width:${pct(t.done,t.total)}%"></i></div>
    </div>`).join("")}
  </div>

  <h3>Chủ đề yếu nhất</h3>
  <div class="card">${weak.length ? weak.map(w => `<div class="list"><div class="it"><span class="q">${esc(TOPICS[w.k])}</span><span class="pill ${w.acc<70?'bad':'ok'}">${w.acc}% đúng</span></div></div>`).join("") + `<div class="row" style="margin-top:10px"><button class="btn soft" onclick="P.topic='${weak[0].k}';P.list=null;go('prac')">Luyện chủ đề yếu nhất</button></div>` : `<div class="muted">Chưa đủ dữ liệu — hãy trả lời ít nhất 3 câu mỗi chủ đề.</div>`}</div>

  <h3>Lịch sử thi thử</h3>
  <div class="card">${S.exams.length ? `<table class="h"><tr><th>Ngày</th><th>Số câu</th><th>Điểm /10</th><th>Đúng</th><th>Thời gian</th></tr>${S.exams.slice().reverse().slice(0,15).map(e=>`<tr><td>${new Date(e.date).toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</td><td>${e.total}${e.src==='wrong'?' (câu sai)':''}</td><td><b>${e.score.toFixed(1)}</b></td><td>${e.correct}/${e.total}</td><td>${fmtTime(e.used)}</td></tr>`).join("")}</table>` : `<div class="muted">Chưa có bài thi nào.</div>`}</div>

  ${flagged.length ? `<h3>Câu cần kiểm tra lại</h3><div class="card"><div class="muted" style="font-size:14px;margin-bottom:6px">Những câu dưới đây giữ nguyên đáp án theo đề cương, nhưng có thể khác với một số giáo trình — nên đối chiếu với giảng viên.</div><div class="list">${flagged.map(q=>`<div class="it"><span class="q"><b>Câu ${q.id}:</b> ${esc(q.f)}</span></div>`).join("")}</div></div>` : ""}

  <h3>Dữ liệu</h3>
  <div class="card">
    <div class="row">
      <button class="btn ghost" onclick="exportCSV()">Xuất kết quả (CSV)</button>
      <button class="btn ghost" onclick="exportJSON()">Sao lưu (JSON)</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" onclick="$('#imp').click()">Khôi phục từ file</button>
      <button class="btn danger" onclick="resetAll()">Xoá toàn bộ tiến độ</button>
    </div>
    <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importJSON(this)">
    <div class="muted" style="font-size:13px;margin-top:10px">Tiến độ được lưu trên trình duyệt của thiết bị này (LocalStorage). Dùng “Sao lưu” để chuyển sang máy khác.</div>
  </div>`;
}
function fmtTime(s){ s = Math.max(0, Math.round(s||0)); const m = Math.floor(s/60), x = s%60; return `${m}:${String(x).padStart(2,"0")}`; }
function download(name, text, type){
  const blob = new Blob([text], { type }); const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCSV(){
  const s = stats(); const q = v => `"${String(v).replace(/"/g,'""')}"`;
  let out = "﻿KẾT QUẢ ÔN TẬP KÝ SINH TRÙNG Y HỌC\nXuất lúc," + q(new Date().toLocaleString("vi-VN")) + "\n";
  out += `Đã học,${s.done}/${QUESTIONS.length}\nTỷ lệ đúng,${s.acc}%\nCâu sai cần ôn,${s.wrongActive}\n\n`;
  out += "Câu,Chủ đề,Câu hỏi,Đáp án đúng,Số lần làm,Số lần đúng,Số lần sai,Còn trong danh sách sai,Flashcard\n";
  for (const x of QUESTIONS){ const t = S.q[x.id] || {}; out += [x.id, q(TOPICS[x.t]), q(x.q), q(x.a), t.n||0, t.c||0, t.w||0, t.wa?"Có":"", t.card==="k"?"Đã nhớ":t.card==="u"?"Chưa nhớ":""].join(",") + "\n"; }
  out += "\nLỊCH SỬ THI THỬ\nNgày,Số câu,Điểm /10,Đúng,Sai,Bỏ trống,Thời gian\n";
  for (const e of S.exams) out += [q(new Date(e.date).toLocaleString("vi-VN")), e.total, e.score.toFixed(2), e.correct, e.wrong, e.blank, fmtTime(e.used)].join(",") + "\n";
  download("ket-qua-on-tap-KST.csv", out, "text/csv;charset=utf-8"); toast("Đã xuất file CSV");
}
function exportJSON(){ download("sao-luu-KST.json", JSON.stringify(S), "application/json"); toast("Đã tạo file sao lưu"); }
function importJSON(inp){
  const f = inp.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.q || !d.exams) throw 0; S = d; save(); render(); renderTabs(); toast("Đã khôi phục tiến độ"); } catch(e){ alert("File không hợp lệ."); } };
  r.readAsText(f);
}
function resetAll(){ if (!confirm("Xoá toàn bộ tiến độ, câu sai, flashcard và lịch sử thi?")) return; S = blank(); save(); P.list=null; F.queue=null; render(); renderTabs(); toast("Đã làm mới tiến độ"); }

// ================= LUYỆN TẬP =================
// P: trạng thái phiên luyện tập. list = mảng {id, o:{opts,correct}, pick:null|index}
const P = { topic:"all", order:"seq", list:null, i:0, src:"all" };
function buildPractice(){
  let ids = QUESTIONS.filter(q => P.topic==="all" || q.t===P.topic).map(q => q.id);
  if (P.order === "rand") ids = shuffle(ids);
  if (P.order === "new") ids = ids.filter(id => !(S.q[id] && S.q[id].n));
  P.list = ids.map(id => ({ id, o: makeOptions(QMAP[id]), pick: null })); P.i = 0;
}
function setPTopic(t){ P.topic = t; P.list = null; render(); }
function setPOrder(o){ P.order = o; P.list = null; render(); }
function renderPrac(){
  if (!P.list) buildPractice();
  const head = `<h2>Luyện tập</h2>
    ${topicChips(P.topic, "setPTopic")}
    <div class="chips" style="margin:10px 0 14px">
      <button class="chip ${P.order==='seq'?'on':''}" onclick="setPOrder('seq')">Theo thứ tự</button>
      <button class="chip ${P.order==='rand'?'on':''}" onclick="setPOrder('rand')">Ngẫu nhiên</button>
      <button class="chip ${P.order==='new'?'on':''}" onclick="setPOrder('new')">Chưa làm</button>
    </div>`;
  if (!P.list.length) return head + `<div class="card empty">Không còn câu nào trong mục này 🎉</div>`;
  return head + questionCard(P, "pracPick", "pracNav", false);
}
function questionCard(ctx, pickFn, navFn, wrongMode){
  const it = ctx.list[ctx.i]; const q = QMAP[it.id]; const answered = it.pick !== null;
  const s = S.q[q.id];
  const opts = it.o.opts.map((t, k) => {
    let cls = "";
    if (answered){ if (k === it.o.correct) cls = "right"; else if (k === it.pick) cls = "wrong"; }
    return `<button class="opt ${cls}" ${answered?"disabled":""} onclick="${pickFn}(${k})"><span class="k">${LETTERS[k]}</span><span>${esc(t)}</span></button>`;
  }).join("");
  let fb = "";
  if (answered){
    const ok = it.pick === it.o.correct;
    fb = `<div class="fb ${ok?'ok':'bad'}"><b class="t">${ok?"✓ Chính xác!":"✗ Chưa đúng"}</b>${ok?"":`Đáp án đúng: <b>${LETTERS[it.o.correct]}. ${esc(q.a)}</b><br>`}<span>${esc(q.e)}</span></div>`;
    if (q.f) fb += `<div class="flag">⚠ <b>Cần kiểm tra:</b> ${esc(q.f)}</div>`;
  }
  const done = ctx.list.filter(x => x.pick !== null).length;
  return `<div class="card">
    <div class="qhead"><span>Câu ${ctx.i+1}/${ctx.list.length} · <b>#${q.id}</b></span><span>${s&&s.w?`<span class="pill bad">Sai ${s.w} lần</span>`:""}</span></div>
    <div class="bar"><i style="width:${pct(done,ctx.list.length)}%"></i></div>
    <div style="margin-top:12px"><span class="tag">${esc(topicName(q.t))}</span> ${q.f?'<span class="tag warn">⚠ Cần kiểm tra</span>':''}</div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${opts}</div>
    ${fb}
    <div class="nav3">
      <button class="btn ghost" ${ctx.i===0?"disabled":""} onclick="${navFn}(-1)">‹ Trước</button>
      <button class="btn soft" ${answered||ctx.i>=ctx.list.length-1?"disabled":""} onclick="${navFn}(1)">Bỏ qua</button>
      <button class="btn" ${ctx.i>=ctx.list.length-1?"disabled":""} onclick="${navFn}(1)">Tiếp ›</button>
    </div>
    <div class="muted" style="text-align:center;font-size:13px;margin-top:10px">Đã trả lời ${done}/${ctx.list.length} · Đúng ${ctx.list.filter(x=>x.pick!==null&&x.pick===x.o.correct).length}</div>
  </div>`;
}
function pracPick(k){ const it = P.list[P.i]; if (it.pick !== null) return; it.pick = k; record(it.id, k === it.o.correct); render(); renderTabs(); }
function pracNav(d){ P.i = Math.max(0, Math.min(P.list.length-1, P.i + d)); render(); window.scrollTo(0,0); }

// ================= THI THỬ =================
let E = null; // {list:[{id,o,pick}], i, total, dur, end, running, submitted, src}
const EX = { n:30, perQ:60, topic:"all" };
function renderExam(){
  if (E && E.submitted) return examResult();
  if (E && E.running) return examRun();
  const avail = QUESTIONS.filter(q => EX.topic==="all" || q.t===EX.topic).length;
  return `<h2>Thi thử</h2>
  <div class="card">
    <label class="f">Số câu</label>
    <div class="chips">${[30,50,110].map(n=>`<button class="chip ${EX.n===n?'on':''}" onclick="EX.n=${n};render()">${n} câu</button>`).join("")}</div>
    <label class="f">Thời gian mỗi câu</label>
    <div class="chips">${[[45,"45 giây"],[60,"1 phút"],[90,"1,5 phút"]].map(([v,l])=>`<button class="chip ${EX.perQ===v?'on':''}" onclick="EX.perQ=${v};render()">${l}</button>`).join("")}</div>
    <label class="f">Phạm vi</label>
    ${topicChips(EX.topic, "setExTopic")}
    <div class="muted" style="margin:14px 0;font-size:14.5px">Đề gồm <b>${Math.min(EX.n,avail)}</b> câu, thời gian <b>${fmtTime(Math.min(EX.n,avail)*EX.perQ)}</b>. Câu hỏi và đáp án được đảo ngẫu nhiên; không hiển thị đáp án khi đang thi; tự động nộp khi hết giờ.</div>
    <button class="btn block" onclick="startExam()">Bắt đầu thi</button>
  </div>`;
}
function setExTopic(t){ EX.topic = t; render(); }
function startExam(ids, src){
  if (!ids){ ids = shuffle(QUESTIONS.filter(q => EX.topic==="all" || q.t===EX.topic).map(q=>q.id)).slice(0, EX.n); }
  else ids = shuffle(ids);
  const total = ids.length; const dur = total * EX.perQ;
  E = { list: ids.map(id => ({ id, o: makeOptions(QMAP[id]), pick: null })), i:0, total, dur, start: Date.now(), end: Date.now() + dur*1000, running:true, submitted:false, src: src||"bank" };
  view = "exam"; renderTabs(); render(); window.scrollTo(0,0);
  stopExam(); examTimer = setInterval(tick, 500);
}
function stopExam(){ if (examTimer) { clearInterval(examTimer); examTimer = null; } }
function tick(){
  if (!E || !E.running) return stopExam();
  const left = Math.max(0, (E.end - Date.now())/1000);
  const el = $("#timer"); if (el){ el.textContent = "⏱ " + fmtTime(left); el.classList.toggle("low", left < 60); }
  if (left <= 0){ submitExam(true); }
}
function examRun(){
  const it = E.list[E.i]; const q = QMAP[it.id]; const left = Math.max(0, (E.end - Date.now())/1000);
  const answered = E.list.filter(x => x.pick !== null).length;
  return `<div class="sec-title" style="margin-bottom:10px"><h2 style="margin:0">Đang thi</h2><span id="timer" class="timer ${left<60?'low':''}">⏱ ${fmtTime(left)}</span></div>
  <div class="card">
    <div class="qhead"><span>Câu ${E.i+1}/${E.total}</span><span>Đã làm ${answered}/${E.total}</span></div>
    <div class="bar"><i style="width:${pct(answered,E.total)}%"></i></div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${it.o.opts.map((t,k)=>`<button class="opt ${it.pick===k?'sel':''}" onclick="examPick(${k})"><span class="k">${LETTERS[k]}</span><span>${esc(t)}</span></button>`).join("")}</div>
    <div class="nav3">
      <button class="btn ghost" ${E.i===0?"disabled":""} onclick="examNav(-1)">‹ Trước</button>
      <button class="btn soft" ${it.pick===null?"disabled":""} onclick="examPick(null)">Bỏ chọn</button>
      <button class="btn" ${E.i>=E.total-1?"disabled":""} onclick="examNav(1)">Tiếp ›</button>
    </div>
  </div>
  <div class="card"><div class="muted" style="font-size:13.5px;margin-bottom:8px">Chuyển nhanh đến câu</div>
    <div class="qgrid">${E.list.map((x,k)=>`<button class="${x.pick!==null?'ans':''} ${k===E.i?'cur':''}" onclick="examJump(${k})">${k+1}</button>`).join("")}</div>
    <button class="btn block" style="margin-top:14px" onclick="submitExam(false)">Nộp bài</button>
  </div>`;
}
function examPick(k){ E.list[E.i].pick = k; if (k !== null && E.i < E.total-1) { E.i++; } render(); }
function examNav(d){ E.i = Math.max(0, Math.min(E.total-1, E.i+d)); render(); window.scrollTo(0,0); }
function examJump(k){ E.i = k; render(); window.scrollTo(0,0); }
function submitExam(auto){
  if (!E || !E.running) return;
  if (!auto){ const blankN = E.list.filter(x=>x.pick===null).length; if (!confirm(blankN ? `Còn ${blankN} câu chưa làm. Nộp bài?` : "Nộp bài?")) return; }
  stopExam(); E.running = false; E.submitted = true;
  let c=0,w=0,b=0;
  for (const x of E.list){
    if (x.pick === null){ b++; const s = st(x.id); s.wa = true; s.last = 0; } // bỏ trống: đưa vào danh sách ôn, không tính lần sai
    else if (x.pick === x.o.correct){ c++; record(x.id, true); }
    else { w++; record(x.id, false); }
  }
  const used = Math.min(E.dur, (Date.now() - E.start)/1000);
  E.res = { c, w, b, score: c*10/E.total, used };
  S.exams.push({ date: Date.now(), total: E.total, correct:c, wrong:w, blank:b, score: c*10/E.total, used, src: E.src });
  save(); E.i = 0; E.rf = "all";
  if (auto) toast("Hết giờ — đã tự động nộp bài");
  view = "exam"; renderTabs(); render(); window.scrollTo(0,0);
}
function examResult(){
  const r = E.res;
  const list = E.list.map((x,k)=>({x,k})).filter(({x}) => E.rf==="all" || (E.rf==="w" && x.pick!==null && x.pick!==x.o.correct) || (E.rf==="b" && x.pick===null) || (E.rf==="r" && x.pick===x.o.correct));
  return `<h2>Kết quả thi thử</h2>
  <div class="card" style="text-align:center">
    <div class="score">${r.score.toFixed(1)}<span style="font-size:20px;color:var(--muted)">/10</span></div>
    <div class="muted" style="margin-top:6px">Tỷ lệ đúng ${pct(r.c,E.total)}% · Thời gian ${fmtTime(r.used)}</div>
    <div class="grid g4" style="margin-top:14px;grid-template-columns:repeat(3,1fr)">
      <div class="stat"><b style="color:var(--ok)">${r.c}</b><span>Đúng</span></div>
      <div class="stat"><b style="color:var(--bad)">${r.w}</b><span>Sai</span></div>
      <div class="stat"><b style="color:var(--muted)">${r.b}</b><span>Bỏ trống</span></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" onclick="E=null;render()">Làm đề mới</button>
      ${r.w+r.b ? `<button class="btn" onclick="go('wrong')">Ôn câu sai</button>` : ""}
    </div>
  </div>
  <h3>Xem lại bài làm</h3>
  <div class="chips" style="margin-bottom:10px">${[["all","Tất cả"],["w","Sai"],["b","Bỏ trống"],["r","Đúng"]].map(([k,l])=>`<button class="chip ${E.rf===k?'on':''}" onclick="E.rf='${k}';render()">${l}</button>`).join("")}</div>
  ${list.length ? list.map(({x,k}) => reviewItem(x,k)).join("") : `<div class="card empty">Không có câu nào.</div>`}`;
}
function reviewItem(x, k){
  const q = QMAP[x.id]; const st_ = x.pick===null ? "b" : x.pick===x.o.correct ? "r" : "w";
  return `<div class="card">
    <div class="qhead"><span>Câu ${k+1} · #${q.id}</span><span class="pill ${st_==='r'?'ok':'bad'}">${st_==='r'?'Đúng':st_==='w'?'Sai':'Bỏ trống'}</span></div>
    <div class="qtext" style="font-size:16px;margin-top:4px">${esc(q.q)}</div>
    <div class="opts">${x.o.opts.map((t,j)=>`<div class="opt ${j===x.o.correct?'right':(j===x.pick?'wrong':'')}"><span class="k">${LETTERS[j]}</span><span>${esc(t)}</span></div>`).join("")}</div>
    <div class="fb ${st_==='r'?'ok':'bad'}">${esc(q.e)}</div>
    ${q.f?`<div class="flag">⚠ <b>Cần kiểm tra:</b> ${esc(q.f)}</div>`:""}
  </div>`;
}

// ================= FLASHCARD =================
const F = { topic:"all", queue:null, i:0, flip:false, mode:"smart" };
function buildCards(){
  let qs = QUESTIONS.filter(q => F.topic==="all" || q.t===F.topic);
  const rank = q => { const c = (S.q[q.id]||{}).card; return c==="u" ? 0 : c==null ? 1 : 2; };
  if (F.mode === "smart") qs = shuffle(qs).sort((a,b) => rank(a)-rank(b));   // chưa nhớ → chưa học → đã nhớ
  else if (F.mode === "unknown") qs = shuffle(qs.filter(q => (S.q[q.id]||{}).card==="u"));
  else qs = qs.slice();
  F.queue = qs.map(q => q.id); F.i = 0; F.flip = false;
}
function setFTopic(t){ F.topic = t; F.queue = null; render(); }
function setFMode(m){ F.mode = m; F.queue = null; render(); }
function renderCard(){
  if (!F.queue) buildCards();
  const s = stats();
  const head = `<h2>Flashcard</h2>${topicChips(F.topic,"setFTopic")}
  <div class="chips" style="margin:10px 0 14px">
    <button class="chip ${F.mode==='smart'?'on':''}" onclick="setFMode('smart')">Ưu tiên chưa nhớ</button>
    <button class="chip ${F.mode==='unknown'?'on':''}" onclick="setFMode('unknown')">Chỉ thẻ chưa nhớ (${s.unknown})</button>
    <button class="chip ${F.mode==='seq'?'on':''}" onclick="setFMode('seq')">Theo thứ tự</button>
  </div>`;
  if (!F.queue.length) return head + `<div class="card empty">Không có thẻ nào trong mục này.</div>`;
  if (F.i >= F.queue.length) return head + `<div class="card empty"><div style="font-size:36px">🎉</div><b>Hoàn thành lượt ôn!</b><div style="margin:6px 0 14px">Đã nhớ ${s.known} · Chưa nhớ ${s.unknown}</div><button class="btn" onclick="F.queue=null;render()">Ôn lượt mới</button></div>`;
  const q = QMAP[F.queue[F.i]]; const c = (S.q[q.id]||{}).card;
  return head + `
  <div class="qhead"><span>Thẻ ${F.i+1}/${F.queue.length} · #${q.id}</span><span>${c==="k"?'<span class="pill ok">Đã nhớ</span>':c==="u"?'<span class="pill bad">Chưa nhớ</span>':''}</span></div>
  <div class="bar" style="margin-bottom:12px"><i style="width:${pct(F.i,F.queue.length)}%"></i></div>
  <div class="fc-wrap"><div class="fc ${F.flip?'flip':''}" id="fc" onclick="flipCard()">
    <div class="face front"><div class="lbl">Câu hỏi · ${esc(TOPICS[q.t].split(" (")[0])}</div><div class="q">${esc(q.q)}</div><div class="hint">Chạm để lật thẻ</div></div>
    <div class="face back"><div class="lbl">Đáp án</div><div class="ans">${esc(q.a)}</div><div style="font-size:15.5px">${esc(q.e)}</div>${q.f?`<div class="flag">⚠ ${esc(q.f)}</div>`:""}</div>
  </div></div>
  <div class="row" style="margin-top:14px">
    <button class="btn bad" onclick="rateCard('u')">✗ Chưa nhớ</button>
    <button class="btn ok" onclick="rateCard('k')">✓ Đã nhớ</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn ghost" ${F.i===0?"disabled":""} onclick="F.i--;F.flip=false;render()">‹ Thẻ trước</button>
    <button class="btn ghost" onclick="flipCard()">Lật thẻ</button>
  </div>`;
}
renderCard.after = () => {
  // điều chỉnh chiều cao thẻ theo mặt dài hơn
  const fc = $("#fc"); if (!fc) return; let h = 340;
  fc.querySelectorAll(".face").forEach(f => { f.style.position="relative"; h = Math.max(h, f.scrollHeight); f.style.position=""; });
  fc.style.minHeight = h + "px";
};
function flipCard(){ F.flip = !F.flip; const fc = $("#fc"); if (fc) fc.classList.toggle("flip", F.flip); }
function rateCard(v){
  const id = F.queue[F.i]; st(id).card = v; save();
  if (v === "u" && F.mode !== "seq"){ // đưa thẻ chưa nhớ quay lại cuối hàng (sau ~4 thẻ) để ôn lại
    const pos = Math.min(F.queue.length, F.i + 5); F.queue.splice(pos, 0, id);
  }
  F.i++; F.flip = false; render(); renderTabs();
}

// ================= ÔN CÂU SAI =================
const W = { list:null, i:0, running:false };
function wrongIds(){ return QUESTIONS.filter(q => (S.q[q.id]||{}).wa).map(q => q.id); }
function renderWrong(){
  if (W.running) return renderWrongRun();
  const ids = wrongIds();
  const hist = QUESTIONS.filter(q => (S.q[q.id]||{}).w > 0).sort((a,b)=> S.q[b.id].w - S.q[a.id].w);
  return `<h2>Ôn tập câu sai</h2>
  <div class="card">
    <div class="grid g2">
      <div class="stat"><b style="color:var(--bad)">${ids.length}</b><span>Câu đang sai</span></div>
      <div class="stat"><b>${hist.length}</b><span>Câu từng sai</span></div>
    </div>
    <div class="muted" style="font-size:14px;margin:12px 0">Câu trả lời sai (và câu bỏ trống khi thi) được tự động lưu. Làm lại đến khi trả lời đúng thì câu sẽ rời khỏi danh sách; số lần sai vẫn được ghi nhận.</div>
    <div class="row">
      <button class="btn" ${ids.length?"":"disabled"} onclick="startWrong()">Làm lại câu sai</button>
      <button class="btn ghost" ${ids.length?"":"disabled"} onclick="startExam(wrongIds(),'wrong')">Tạo đề thi từ câu sai</button>
    </div>
  </div>
  <h3>Theo dõi số lần sai</h3>
  <div class="card">${hist.length ? `<div class="list">${hist.map(q => { const s=S.q[q.id]; return `<div class="it"><span class="q"><b>#${q.id}</b> ${esc(q.q.length>110?q.q.slice(0,110)+"…":q.q)}</span><span class="pill ${s.wa?'bad':'ok'}">${s.wa?'Sai':'Đã sửa'} · ${s.w}×</span></div>`; }).join("")}</div>` : `<div class="empty">Chưa có câu sai nào. Hãy luyện tập hoặc thi thử!</div>`}</div>`;
}
function startWrong(){ const ids = shuffle(wrongIds()); W.list = ids.map(id => ({ id, o: makeOptions(QMAP[id]), pick:null })); W.i = 0; W.running = true; render(); }
function renderWrongRun(){
  if (!W.list.length) { W.running=false; return renderWrong(); }
  const left = W.list.filter(x => x.pick===null).length;
  const head = `<div class="sec-title" style="margin-bottom:10px"><h2 style="margin:0">Làm lại câu sai</h2><button class="btn ghost" style="min-height:40px;padding:6px 14px" onclick="W.running=false;render()">Thoát</button></div>`;
  if (W.i >= W.list.length) {
    const still = wrongIds().length;
    return head + `<div class="card empty"><div style="font-size:36px">${still?'💪':'🎉'}</div><b>${still?`Còn ${still} câu chưa đúng`:'Đã sửa hết câu sai!'}</b><div class="row" style="margin-top:14px">${still?`<button class="btn" onclick="startWrong()">Làm lại các câu còn sai</button>`:''}<button class="btn ghost" onclick="W.running=false;render()">Về danh sách</button></div></div>`;
  }
  return head + questionCard(W, "wrongPick", "wrongNav", true) + `<div class="muted" style="text-align:center;font-size:13px;margin-top:8px">Còn ${left} câu chưa trả lời trong lượt này</div>`;
}
function wrongPick(k){ const it = W.list[W.i]; if (it.pick!==null) return; it.pick = k; record(it.id, k===it.o.correct); render(); renderTabs(); }
function wrongNav(d){ if (d>0 && W.i === W.list.length-1) { W.i++; } else W.i = Math.max(0, Math.min(W.list.length-1, W.i+d)); render(); window.scrollTo(0,0); }

// Ghi đè nút "Tiếp" ở câu cuối của chế độ câu sai để hiện màn kết thúc
const _qc = questionCard;
questionCard = function(ctx, pickFn, navFn, wrongMode){
  let h = _qc(ctx, pickFn, navFn, wrongMode);
  if (wrongMode && ctx.i === ctx.list.length-1) h = h.replace(/<button class="btn" disabled onclick="wrongNav\(1\)">Tiếp ›<\/button>/, `<button class="btn" onclick="wrongNav(1)">Kết thúc ›</button>`);
  return h;
};

// ---------- khởi động ----------
$("#subtitle").textContent = `${QUESTIONS.length} câu · ${Object.keys(TOPICS).length} chủ đề`;
renderTabs(); render();
window.addEventListener("beforeunload", e => { if (E && E.running) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const k = e.key.toUpperCase(); const idx = "ABCD".indexOf(k) >= 0 ? "ABCD".indexOf(k) : "1234".indexOf(e.key);
  if (view==="card" && (e.key===" "||e.key==="Enter")) { e.preventDefault(); flipCard(); return; }
  if (idx >= 0){
    if (view==="prac" && P.list && P.list.length) pracPick(idx);
    else if (view==="exam" && E && E.running) examPick(idx);
    else if (view==="wrong" && W.running && W.i < W.list.length) wrongPick(idx);
  }
  if (e.key==="ArrowRight"){ if(view==="prac") pracNav(1); else if(view==="exam"&&E&&E.running) examNav(1); }
  if (e.key==="ArrowLeft"){ if(view==="prac") pracNav(-1); else if(view==="exam"&&E&&E.running) examNav(-1); }
});
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
